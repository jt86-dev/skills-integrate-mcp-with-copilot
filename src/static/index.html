<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <button id="admin-mode-button" type="button">Teacher login</button>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <dialog id="admin-dialog" aria-labelledby="admin-dialog-title">
      <form id="admin-login-form">
        <h3 id="admin-dialog-title">Teacher login</h3>
        <div class="form-group">
          <label for="admin-username">Username:</label>
          <input id="admin-username" name="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="admin-password">Password:</label>
          <input id="admin-password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <p id="admin-message" class="hidden" role="alert"></p>
        <div class="dialog-actions">
          <button type="submit">Log in</button>
          <button id="cancel-admin-login" class="secondary-button" type="button">Cancel</button>
        </div>
      </form>
    </dialog>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" hidden>
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
